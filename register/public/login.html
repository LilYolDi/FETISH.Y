<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Y-FETISH — Вход</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>

<body>

<div class="page">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <span>Y</span>-FETISH
        </div>

        <div class="search">

            <span>⌕</span>

            <input
                type="text"
                placeholder="Поиск..."
            >

        </div>

        <div class="side-menu">
            <div>⌂</div>
            <div>♡</div>
            <div>♙</div>
            <div>▣</div>
            <div>⚙️</div>
        </div>

    </aside>


    <!-- CONTENT -->

    <main class="content">

        <header class="top-menu">

            <a href="index.html">
                Главная
            </a>

            <a href="#">
                Купить рекламу
            </a>

        </header>


        <section class="login-section">

            <div class="login-card">

                <div class="login-logo">
                    <span>Y</span>-FETISH
                </div>

                <h1>
                    Вход в Y-FETISH
                </h1>

                <p class="description">
                    Войдите или зарегистрируйтесь
                    через Telegram
                </p>


                <!-- TELEGRAM -->

                <div class="telegram-box">

                    <div class="telegram-icon">
                        ✈️
                    </div>

                    <h2>
                        Telegram
                    </h2>

                    <p>
                        Один Telegram-аккаунт
                        для Y-FETISH
                    </p>


                    <div
                        class="telegram-widget"
                        id="telegram-widget"
                    >

                        <script async
                            src="https://telegram.org/js/telegram-widget.js?22"
                            data-telegram-login="FETISH_Y_bot"
                            data-size="large"
                            data-userpic="false"
                            data-request-access="write"
                            data-onauth="onTelegramAuth(user)"
                            data-lang="ru">
                        </script>

                    </div>

                </div>


                <!-- STATUS -->

                <div
                    id="status"
                    class="status"
                >
                    Ожидание входа...
                </div>


                <!-- ACCOUNT -->

                <div
                    id="account"
                    class="account hidden"
                >

                    <img
                        id="avatar"
                        class="avatar"
                        src=""
                        alt="Аватар"
                    >

                    <div class="account-info">

                        <div
                            id="account-name"
                            class="account-name"
                        ></div>

                        <div
                            id="account-username"
                            class="account-username"
                        ></div>

                    </div>

                    <button
                        id="logout"
                        class="logout"
                    >
                        Выйти
                    </button>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- LOGIN JAVASCRIPT -->

<script src="login.js"></script>

</body>

</html>
